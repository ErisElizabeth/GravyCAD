<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="Calculator.css">
  <style>
    /* Demo page only: a stand-in for the host app's canvas. */
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #2e343a;
      background-image:
        linear-gradient(#3a4148 1px, transparent 1px),
        linear-gradient(90deg, #3a4148 1px, transparent 1px);
      background-size: 24px 24px;
      font: 13px "Atkinson Hyperlegible", sans-serif;
      color: #dfe4e9;
    }
    .demo-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: #22272c;
    }
  </style>
</head>
<body>
  <div class="demo-bar">
    <button id="toggle" type="button">Show / hide calculator</button>
    <span id="last">Last result: none</span>
  </div>

  <script src="Calculator.js"></script>
  <script>
    const calc = Calculator.create({
      angleMode: 'deg',
      onResult: (value, text) => { document.getElementById('last').textContent = 'Last result: ' + text; },
    });
    calc.focus();
    document.getElementById('toggle').addEventListener('click', () => calc.toggle());
  </script>
</body>
</html>
